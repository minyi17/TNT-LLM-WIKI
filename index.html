<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f2">
  <meta name="description" content="時代少年團公開資料知識庫：成員、音樂作品、演唱會與重要事件。">
  <title>時代少年團 Wiki</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="開啟導覽選單" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a class="brand" href="#/overview" data-page-link="overview" aria-label="時代少年團 Wiki 首頁">
      <span class="brand-mark" aria-hidden="true">T</span>
      <span class="brand-copy">
        <strong>時代少年團 Wiki</strong>
        <small>公開資料知識庫</small>
      </span>
    </a>
    <label class="search-box" for="siteSearch">
      <span aria-hidden="true">⌕</span>
      <input id="siteSearch" type="search" placeholder="搜尋頁面與內容" autocomplete="off">
      <kbd>Ctrl K</kbd>
    </label>
  </header>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar" aria-label="網站導覽">
      <div class="sidebar-heading">知識目錄</div>
      <div id="navigation"></div>
      <div class="sidebar-footer">
        <span class="status-dot" aria-hidden="true"></span>
        <span>內容以 Wiki 頁面為準</span>
      </div>
    </aside>
    <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="關閉導覽選單"></button>

    <main class="main-content" id="mainContent">
      <div class="search-results" id="searchResults" aria-live="polite"></div>
      <div class="page-context">
        <span class="context-mark" aria-hidden="true"></span>
        <span id="breadcrumb">時代少年團 / 總覽</span>
      </div>
      <article class="article-card" id="article" aria-live="polite">
        <p class="loading-message">正在載入知識庫…</p>
      </article>
      <footer class="page-footer">
        <span>資料整理自專案 Wiki 頁面</span>
        <span>GitHub Pages 靜態站點</span>
      </footer>
    </main>
  </div>

  <script src="./content.js"></script>
  <script src="./script.js"></script>
</body>
</html>
